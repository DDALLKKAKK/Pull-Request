<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#610085">
  <title>🍆</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🍆</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500&display=swap" rel="stylesheet">
  <style>
    * { -webkit-user-select: none; user-select: none; }
    html, body { margin: 0; height: 100%; overflow: hidden; }
    body { background: #9000c4; touch-action: none; }
    canvas { display: block; }

    #more-info {
      position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%);
      z-index: 100; padding: 10px 20px;
      color: #fff; font: 15px Poppins, sans-serif; text-decoration: underline;
      background: none; border: 0; outline: none; cursor: pointer;
      opacity: .7; transition: opacity 4s;
      -webkit-tap-highlight-color: transparent;
    }
    #more-info:hover { opacity: 1; }

    #popup {
      position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
      z-index: 200; padding: 25px; border-radius: 20px;
      background: rgba(0, 0, 0, .7); color: #fff; text-align: center;
      font: 15px Poppins, sans-serif;
      visibility: hidden; opacity: 0;
      transition: opacity .5s, visibility 0s .5s;
    }
    #popup.show { visibility: visible; opacity: .8; transition: opacity .5s; }
    #popup p { margin: 0; }
    #popup p + p { margin-top: 1.2em; }
    #popup a, #popup a:visited { color: #fff; }

    #fallback {
      position: absolute; inset: 0; display: none;
      align-items: center; justify-content: center;
      font-size: 160px;
    }
  </style>
</head>
<body>
  <button id="more-info" type="button">???</button>
  <div id="popup">
    <p>original <a href="https://xn--gi8h42h.ws/" target="_blank" rel="noopener">🍆.ws</a> by <a href="https://maxvanleeuwen.com" target="_blank" rel="noopener">Max van Leeuwen</a></p>
    <p>eggplant modeled in code with <a href="https://threejs.org/" target="_blank" rel="noopener">three.js</a></p>
  </div>
  <div id="fallback">🍆</div>

  <script type="importmap">
    { "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
    } }
  </script>

  <script type="module">
    import * as THREE from 'three';
    import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

    // ---------- renderer / camera / scene ----------
    let renderer;
    try {
      renderer = new THREE.WebGLRenderer({ antialias: true });
    } catch (e) {
      document.getElementById('fallback').style.display = 'flex';
      throw e;
    }
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.2;
    document.body.appendChild(renderer.domElement);

    const camera = new THREE.PerspectiveCamera(50, innerWidth / innerHeight, 0.01, 500);
    camera.position.set(0, 5, 10);
    camera.lookAt(0, 0, 0);
    camera.updateMatrixWorld();

    const scene = new THREE.Scene();
    const pmrem = new THREE.PMREMGenerator(renderer);
    scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;

    // ---------- radial gradient background ----------
    const bgUniforms = {
      inner: { value: new THREE.Color('#cc00ff') },
      outer: { value: new THREE.Color('#23004a') },
      aspect: { value: innerHeight / innerWidth },
    };
    const bg = new THREE.Mesh(
      new THREE.PlaneGeometry(2, 2),
      new THREE.ShaderMaterial({
        uniforms: bgUniforms,
        depthWrite: false,
        depthTest: false,
        vertexShader: /* glsl */`
          varying vec2 vUv;
          void main() { vUv = uv; gl_Position = vec4(position.xy, 0.0, 1.0); }`,
        fragmentShader: /* glsl */`
          uniform vec3 inner;
          uniform vec3 outer;
          uniform float aspect;
          varying vec2 vUv;
          void main() {
            // glow sized to the short side: wider on landscape, tighter on portrait
            float k = aspect < 1.5 ? 1.4 : 0.9;
            vec2 p = (vUv - 0.5) * vec2(1.0, aspect) * k;
            float d = clamp(length(p), 0.0, 1.0);
            float f = 1.0 - (1.0 - d) * (1.0 - d);
            gl_FragColor = vec4(mix(inner, outer, f), 1.0);
          }`,
      })
    );
    bg.frustumCulled = false;
    bg.renderOrder = -1;
    scene.add(bg);

    // ---------- lights ----------
    const rimCyan = new THREE.PointLight('#00fff2', 6.5);
    rimCyan.position.set(-1, 0, -1.5);
    const rimPink = new THREE.PointLight('#ff00f7', 4.5);
    rimPink.position.set(1, 0, -2.5);
    const key = new THREE.DirectionalLight('#ffffff', 0.75);
    key.position.set(-3, 6, 8);
    scene.add(rimCyan, rimPink, key, new THREE.AmbientLight('#ffffff', 0.35));

    // ---------- eggplant shape (procedural) ----------
    // Rest pose hangs from the origin: stem points up (+y), body runs down to
    // y = -BODY_LEN and arcs sideways like the emoji.
    const BODY_LEN = 3.0;
    const curveX = (y) => 0.12 * y * y;

    function bodyRadius(s) {
      const top = Math.sqrt(Math.min(1, (s + 0.02) / 0.1));       // rounded shoulder under the calyx
      const tip = Math.sqrt(Math.max(0, 1 - Math.pow(s, 3.2)));  // rounded bottom
      return (0.4 + 0.6 * Math.pow(s, 0.9)) * top * tip;
    }

    function bodyGeometry() {
      const pts = [];
      for (let i = 0; i <= 80; i++) {
        const s = i / 80;
        pts.push(new THREE.Vector2(Math.max(bodyRadius(s), 0.0001), 0.05 - s * (BODY_LEN + 0.05)));
      }
      const geo = new THREE.LatheGeometry(pts.reverse(), 72);
      const pos = geo.attributes.position;
      for (let i = 0; i < pos.count; i++) pos.setX(i, pos.getX(i) + curveX(pos.getY(i)));
      geo.computeVertexNormals();
      return geo;
    }

    function calyxGeometry() {
      const pts = [];
      for (let i = 0; i <= 24; i++) {
        const s = i / 24;
        pts.push(new THREE.Vector2(0.14 + 0.4 * Math.sin(s * Math.PI / 2), 0.14 - 0.36 * s * s));
      }
      const geo = new THREE.LatheGeometry(pts, 120);
      const pos = geo.attributes.position;
      const LOBES = 5;
      for (let i = 0; i < pos.count; i++) {
        const x = pos.getX(i), y = pos.getY(i), z = pos.getZ(i);
        const s = (0.14 - y) / 0.36;                       // 0 at the top ring, 1 at the rim
        const a = Math.atan2(z, x);
        const lobe = Math.pow(0.5 + 0.5 * Math.cos(LOBES * a + 0.6), 2.5);
        const drape = s * s * lobe;
        const r = Math.hypot(x, z) * (1 + 0.1 * drape);
        pos.setXYZ(i, Math.cos(a) * r + curveX(y), y - 0.42 * drape, Math.sin(a) * r);
      }
      geo.computeVertexNormals();
      return geo;
    }

    function stemGeometry() {
      const path = new THREE.CatmullRomCurve3([
        new THREE.Vector3(0, 0.05, 0),
        new THREE.Vector3(-0.01, 0.25, 0),
        new THREE.Vector3(-0.06, 0.42, 0),
        new THREE.Vector3(-0.16, 0.52, 0),
      ]);
      const RADIAL = 16, TUBULAR = 24, R = 0.1;
      const geo = new THREE.TubeGeometry(path, TUBULAR, R, RADIAL, false);
      const pos = geo.attributes.position;
      // taper slightly toward the end of the stem
      for (let i = 0; i < pos.count; i++) {
        const u = Math.floor(i / (RADIAL + 1)) / TUBULAR;
        const c = path.getPointAt(u);
        const k = 1 - 0.35 * u;
        pos.setXYZ(i, c.x + (pos.getX(i) - c.x) * k, c.y + (pos.getY(i) - c.y) * k, c.z + (pos.getZ(i) - c.z) * k);
      }
      const cap = new THREE.SphereGeometry(R * 0.65, 16, 12);
      const end = path.getPointAt(1);
      cap.translate(end.x, end.y, end.z);
      const merged = mergeIndexed([geo, cap]);
      merged.computeVertexNormals();
      return merged;
    }

    // minimal merge for indexed geometries with position/normal/uv
    function mergeIndexed(geos) {
      const position = [], uv = [], index = [];
      let offset = 0;
      for (const g of geos) {
        position.push(...g.attributes.position.array);
        uv.push(...g.attributes.uv.array);
        for (const i of g.index.array) index.push(i + offset);
        offset += g.attributes.position.count;
      }
      const out = new THREE.BufferGeometry();
      out.setAttribute('position', new THREE.Float32BufferAttribute(position, 3));
      out.setAttribute('uv', new THREE.Float32BufferAttribute(uv, 2));
      out.setIndex(index);
      return out;
    }

    // ---------- rig ----------
    // A short chain of bones runs down the eggplant. The first one sits at the
    // top, right where the cursor holds it; the others hang below it.
    const JOINT_Y = [0.1, -1.15, -2.1];          // bone heads, top → bottom
    const jointAt = (y) => new THREE.Vector3(curveX(y), y, 0);
    const TIP = jointAt(-BODY_LEN);

    const rig = new THREE.Group();               // follows the cursor
    scene.add(rig);
    const bones = JOINT_Y.map(() => new THREE.Bone());
    bones.forEach((bone, i) => {
      const head = jointAt(JOINT_Y[i]);
      if (i === 0) { bone.position.copy(head); rig.add(bone); }
      else { bone.position.copy(head).sub(jointAt(JOINT_Y[i - 1])); bones[i - 1].add(bone); }
    });
    rig.updateMatrixWorld(true);
    const skeleton = new THREE.Skeleton(bones);

    // Smoothly hand vertices from one bone to the next around each joint.
    const BLEND = [[-0.85, -1.45], [-1.85, -2.35]];
    const smooth = (a, b, x) => { const t = Math.min(Math.max((x - a) / (b - a), 0), 1); return t * t * (3 - 2 * t); };

    function skin(geo) {
      const pos = geo.attributes.position;
      const idx = new Uint16Array(pos.count * 4);
      const wgt = new Float32Array(pos.count * 4);
      for (let i = 0; i < pos.count; i++) {
        const y = pos.getY(i);
        const past1 = smooth(BLEND[0][0], BLEND[0][1], y);   // 0 above the second joint, 1 below
        const past2 = smooth(BLEND[1][0], BLEND[1][1], y);   // same for the third joint
        const w0 = 1 - past1, w1 = Math.max(0, past1 - past2), w2 = past2;
        idx.set([0, 1, 2, 0], i * 4);
        wgt.set([w0, w1, w2, 0], i * 4);
      }
      geo.setAttribute('skinIndex', new THREE.Uint16BufferAttribute(idx, 4));
      geo.setAttribute('skinWeight', new THREE.Float32BufferAttribute(wgt, 4));
      return geo;
    }

    function skinned(geo, material) {
      const mesh = new THREE.SkinnedMesh(skin(geo), material);
      mesh.bind(skeleton);
      mesh.frustumCulled = false;
      scene.add(mesh);
      return mesh;
    }

    skinned(bodyGeometry(), new THREE.MeshPhysicalMaterial({
      color: '#4e0a96',
      roughness: 0.42,
      metalness: 0.65,
      clearcoat: 0.3,
      clearcoatRoughness: 0.4,
      envMapIntensity: 0.18,
    }));
    skinned(calyxGeometry(), new THREE.MeshPhysicalMaterial({
      color: '#4f8c12',
      roughness: 0.5,
      metalness: 0.15,
      clearcoat: 0.4,
      side: THREE.DoubleSide,
      envMapIntensity: 0.3,
    }));
    skinned(stemGeometry(), new THREE.MeshPhysicalMaterial({
      color: '#4a8510',
      roughness: 0.5,
      clearcoat: 0.4,
      envMapIntensity: 0.3,
    }));

    rig.scale.setScalar(0.95);

    // ---------- wobbly chain ----------
    // Each bone owns a point at its tail. That point is a damped spring chasing
    // where the tail would be if the eggplant were rigid; the bone then turns
    // to aim at it (length kept), so lag shows up as swinging and folding.
    const SPRINGS = [
      { k: 420, c: 14 },     // top joint: loose and bouncy
      { k: 620, c: 20 },     // middle: a bit firmer
      { k: 4000, c: 900 },   // tip: heavy, syrupy follow-through
    ];
    const chain = bones.map((bone, i) => {
      const tailLocal = i + 1 < bones.length ? bones[i + 1].position.clone() : TIP.clone().sub(jointAt(JOINT_Y[i]));
      return {
        bone,
        tailLocal,
        restDir: tailLocal.clone().normalize(),
        point: new THREE.Vector3(),
        vel: new THREE.Vector3(),
        ...SPRINGS[i],
      };
    });

    const _target = new THREE.Vector3();
    const _head = new THREE.Vector3();
    const _dir = new THREE.Vector3();
    const _q = new THREE.Quaternion();

    function seedChain() {
      rig.updateMatrixWorld(true);
      for (const link of chain) {
        link.bone.quaternion.identity();
        link.bone.updateMatrixWorld(true);
        link.point.copy(link.tailLocal).applyMatrix4(link.bone.matrixWorld);
        link.vel.set(0, 0, 0);
      }
    }

    function stepChain(dt) {
      const steps = 8, h = dt / steps;
      for (const link of chain) {
        const { bone } = link;
        bone.quaternion.identity();
        bone.updateMatrixWorld(true);
        _target.copy(link.tailLocal).applyMatrix4(bone.matrixWorld);      // rigid tail
        _head.setFromMatrixPosition(bone.matrixWorld);
        const len = _target.distanceTo(_head);

        for (let s = 0; s < steps; s++) {
          // spring force, damping applied implicitly so stiff/heavy links stay stable
          link.vel.addScaledVector(_dir.subVectors(_target, link.point), link.k * h).divideScalar(1 + link.c * h);
          link.point.addScaledVector(link.vel, h);
        }

        // keep the bone length: project the point back onto its sphere
        _dir.subVectors(link.point, _head);
        if (_dir.lengthSq() < 1e-8) _dir.subVectors(_target, _head);
        _dir.setLength(len);
        link.point.copy(_head).add(_dir);
        link.vel.addScaledVector(_dir, -link.vel.dot(_dir) / (len * len));   // drop the stretching part

        // aim the bone at the point (in its parent's space)
        bone.parent.getWorldQuaternion(_q).invert();
        _dir.applyQuaternion(_q).normalize();
        bone.quaternion.setFromUnitVectors(link.restDir, _dir);
        bone.updateMatrixWorld(true);
      }
    }

    // ---------- droplets ----------
    function dropletGeometry() {
      const pts = [];
      for (let i = 0; i <= 48; i++) {
        const t = (i / 48) * Math.PI;                       // cusp at the top, round at the bottom
        pts.push(new THREE.Vector2(0.55 * Math.sin(t) * Math.sin(t / 2), Math.cos(t)));
      }
      return new THREE.LatheGeometry(pts, 48);
    }
    const dropletMat = new THREE.MeshPhysicalMaterial({
      color: new THREE.Color(0, 0.3, 1),
      metalness: 0.6,
      roughness: 0.25,
      clearcoat: 1,
      sheen: 1,
      sheenColor: new THREE.Color(1, 1, 1),
      sheenRoughness: 0.2,
      emissive: new THREE.Color(0, 0.2, 1),
      emissiveIntensity: 0.3,
      envMapIntensity: 1.2,
    });
    const dropletGeo = dropletGeometry();
    const splash = new THREE.Group();
    splash.scale.setScalar(0.45);
    splash.rotation.x = -0.8;
    const droplets = [
      { pos: [1.4, -1.0], rot: 0.5, size: 1.0 },
      { pos: [0, 0], rot: 0.3, size: 1.4 },
      { pos: [0.6, 0.6], rot: 1.3, size: 1.55 },
    ].map(({ pos, rot, size }) => {
      const pivot = new THREE.Group();                        // pulses
      const mesh = new THREE.Mesh(dropletGeo, dropletMat);     // pops in/out
      mesh.position.set(pos[0], pos[1], 0);
      mesh.rotation.z = rot;
      mesh.scale.setScalar(0);
      mesh.visible = false;
      pivot.add(mesh);
      splash.add(pivot);
      return { pivot, mesh, size };
    });
    scene.add(splash);

    const easeOut = (t) => 1 - Math.pow(1 - t, 3);
    const easeIn = (t) => t * t * t;
    const POP_MS = 350, COOLDOWN_MS = 4500;

    // Each droplet pops in, holds, then shrinks away; scales are worked out
    // from the clock every frame so they stay right even if frames are dropped.
    let splashUntil = 0;
    function burst(now) {
      if (now < splashUntil) return;
      splashUntil = now + COOLDOWN_MS;
      droplets.forEach((d, i) => {
        d.showAt = now + i * 50;
        d.hideAt = now + 1500 - i * 50;
      });
    }

    function updateDroplets(now) {
      for (const d of droplets) {
        let s = 0;
        if (d.showAt !== undefined && now >= d.showAt) {
          s = now < d.hideAt
            ? d.size * easeOut(Math.min((now - d.showAt) / POP_MS, 1))
            : d.size * (1 - easeIn(Math.min((now - d.hideAt) / POP_MS, 1)));
        }
        d.mesh.scale.setScalar(s);
        d.mesh.visible = s > 0;
      }
    }

    // compile droplet shaders up front so the first burst doesn't stutter
    droplets.forEach((d) => { d.mesh.visible = true; });
    renderer.compile(scene, camera);
    droplets.forEach((d) => { d.mesh.visible = false; });

    // ---------- pointer → point on a plane facing the camera ----------
    const ray = new THREE.Raycaster();
    const ndc = new THREE.Vector2();
    const camDir = camera.getWorldDirection(new THREE.Vector3());
    const aimPlane = new THREE.Plane().setFromNormalAndCoplanarPoint(
      camDir.clone().negate(),
      camera.position.clone().addScaledVector(camDir, 10)
    );

    function planePoint(x, y, out) {
      ndc.set((x / innerWidth) * 2 - 1, -(y / innerHeight) * 2 + 1);
      ray.setFromCamera(ndc, camera);
      return ray.ray.intersectPlane(aimPlane, out);
    }

    const target = new THREE.Vector3();
    let held = false;          // becomes true on the first pointer event
    let pointer = null;        // latest pointer position in px
    let lastPointer = null;    // position used on the previous frame

    function onPointer(e) {
      e.preventDefault();
      pointer = { x: e.clientX, y: e.clientY };
      planePoint(e.clientX, e.clientY, target);
      held = true;
    }
    renderer.domElement.addEventListener('pointermove', onPointer, { passive: false });
    renderer.domElement.addEventListener('pointerdown', onPointer, { passive: false });
    addEventListener('wheel', (e) => e.preventDefault(), { passive: false });
    addEventListener('touchmove', (e) => e.preventDefault(), { passive: false });

    // ---------- resize ----------
    function resize() {
      renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
      renderer.setSize(innerWidth, innerHeight);
      camera.aspect = innerWidth / innerHeight;
      camera.updateProjectionMatrix();
      bgUniforms.aspect.value = innerHeight / innerWidth;
    }
    addEventListener('resize', resize);
    resize();

    // ---------- pose ----------
    // Until someone touches it the eggplant lies diagonally like the emoji.
    // Once held, it hangs from the cursor facing the camera, its bottom
    // leaning a little away from the viewer.
    const EMOJI_TILT = 0.62, HANG_LEAN = 0.55;

    function orientRig() {
      rig.lookAt(camera.position);
      if (held) rig.rotateX(HANG_LEAN);
      else rig.rotateZ(EMOJI_TILT);
    }

    planePoint(innerWidth * 0.42, innerHeight * 0.32, target);
    rig.position.copy(target);
    orientRig();
    seedChain();

    // ---------- loop ----------
    const isTouch = 'ontouchstart' in window || navigator.maxTouchPoints > 0;
    const SHAKE_HI = isTouch ? 2.2 : 3.3;   // screen heights per second
    const SHAKE_LO = SHAKE_HI * 0.85;
    let shake = 0, shakeArmed = false;

    let prev = performance.now();
    function frame(now) {
      const dt = Math.min((now - prev) / 1000, 1 / 20);
      prev = now;

      // shake detection: smoothed pointer speed crosses high, then falls back below low
      let speed = 0;
      if (pointer && lastPointer && dt > 0) {
        speed = Math.hypot(pointer.x - lastPointer.x, pointer.y - lastPointer.y) / innerHeight / dt;
      }
      if (pointer) lastPointer = { ...pointer };
      shake += (speed - shake) * Math.min(dt * 5, 1);
      if (shake > SHAKE_HI) shakeArmed = true;
      else if (shakeArmed && shake < SHAKE_LO) { shakeArmed = false; burst(now); }
      rig.position.lerp(target, Math.min(20 * dt, 1));
      orientRig();
      rig.updateMatrixWorld(true);
      stepChain(dt);

      // droplets ride along beside the tip and pulse
      splash.position.copy(chain[chain.length - 1].point);
      splash.position.x += 0.7;
      splash.children.forEach((pivot, i) => pivot.scale.setScalar(1 + 0.05 * Math.sin(now / 80 + 40 * i)));
      updateDroplets(now);

      renderer.render(scene, camera);
      requestAnimationFrame(frame);
    }
    requestAnimationFrame(frame);

    // ---------- "???" credits ----------
    const more = document.getElementById('more-info');
    const popup = document.getElementById('popup');
    let faded = false;
    const fadeTimer = setTimeout(() => {
      faded = true;
      more.style.opacity = '0';
      setTimeout(() => more.remove(), 4000);
    }, 2500);
    more.addEventListener('click', () => {
      popup.classList.add('show');
      if (faded) return;
      clearTimeout(fadeTimer);
      more.style.transition = 'opacity .5s ease';
      more.style.opacity = '0';
      setTimeout(() => more.remove(), 1000);
    });
    document.addEventListener('click', (e) => {
      if (e.target === renderer.domElement) popup.classList.remove('show');
    });
  </script>
</body>
</html>
