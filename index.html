<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#610085">
  <title>🍆</title>
  <!--
    3D model: "Eggplant Emoji 🍆" by animatezach
    https://sketchfab.com/3d-models/eggplant-emoji-531e2c549ae54b9189b460c2ff7e0e44
    Licensed under CC BY-NC-ND 4.0 (http://creativecommons.org/licenses/by-nc-nd/4.0/)
    The .glb file is shipped unmodified; it is only posed at runtime.
  -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@800&display=swap" rel="stylesheet">
  <style>
    * { -webkit-user-select: none; user-select: none; }
    html, body { margin: 0; height: 100%; overflow: hidden; }
    body {
      touch-action: none;
      background-color: #23004a;
      /* radial glow: inner #cc00ff → outer #23004a, eased like 1-(1-d)² */
      background-image: radial-gradient(circle 71.43vw at 50% 50%,
        rgb(204, 0, 255) 0%, rgb(164, 0, 213) 12.5%, rgb(130, 0, 176) 25%,
        rgb(101, 0, 145) 37.5%, rgb(77, 0, 119) 50%, rgb(59, 0, 100) 62.5%,
        rgb(46, 0, 85) 75%, rgb(35, 0, 74) 100%);
    }
    @media (max-aspect-ratio: 2/3) {
      body {
        background-image: radial-gradient(circle 111.1vw at 50% 50%,
          rgb(204, 0, 255) 0%, rgb(164, 0, 213) 12.5%, rgb(130, 0, 176) 25%,
          rgb(101, 0, 145) 37.5%, rgb(77, 0, 119) 50%, rgb(59, 0, 100) 62.5%,
          rgb(46, 0, 85) 75%, rgb(35, 0, 74) 100%);
      }
    }
    canvas { position: fixed; inset: 0; z-index: 1; display: block; }

    /* background text, sits between the gradient and the 3D canvas */
    #backdrop {
      position: fixed; inset: 0; z-index: 0;
      display: flex; align-items: center; justify-content: center;
      pointer-events: none;
    }
    #backdrop p {
      margin: 0; padding: 0 24px;
      color: #fff; text-align: center;
      font: 800 clamp(34px, 6.5vw, 104px)/1.1 'Noto Sans KR', sans-serif;
      letter-spacing: -0.02em;
    }
    .sc-l { display: inline-block; white-space: pre; will-change: transform; }
  </style>
</head>
<body>
  <div id="backdrop"><p data-scatter>예시 텍스트</p></div>

  <script type="importmap">
    { "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/",
      "wiggle/spring": "./vendor/wiggle/WiggleSpring.mjs"
    } }
  </script>

  <script type="module">
    import * as THREE from 'three';
    import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
    import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
    import { TessellateModifier } from 'three/addons/modifiers/TessellateModifier.js';
    import { mergeGeometries } from 'three/addons/utils/BufferGeometryUtils.js';
    // Wiggle Bones for three.js by Xavier (Jack), https://wiggle.three.tools/
    // wiggle@0.0.17, shipped unmodified in vendor/wiggle (MIT, see vendor/wiggle/LICENSE)
    import { WiggleBone } from 'wiggle/spring';

    const MODEL_URL = 'eggplant_emoji.glb';
    const clamp = (v, a, b) => (v < a ? a : v > b ? b : v);
    const smooth = (a, b, x) => { const t = clamp((x - a) / (b - a), 0, 1); return t * t * (3 - 2 * t); };

    // ---------- renderer / camera / scene ----------
    const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
    renderer.setClearColor(0x000000, 0);
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.2;
    document.body.appendChild(renderer.domElement);

    const camera = new THREE.PerspectiveCamera(50, innerWidth / innerHeight, 0.01, 500);
    camera.position.set(0, 5, 10);
    camera.lookAt(0, 0, 0);
    camera.updateMatrixWorld();

    const scene = new THREE.Scene();
    const pmrem = new THREE.PMREMGenerator(renderer);
    scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;
    scene.environmentIntensity = 0.1;

    // lighting as on 🍆.ws: cyan and magenta rims from behind-left / behind-right
    // over a strong white ambient
    const rimCyan = new THREE.DirectionalLight('#00fff2', 6.5);
    rimCyan.position.set(-1, 0, -1.5);
    const rimPink = new THREE.DirectionalLight('#ff00f7', 4.5);
    rimPink.position.set(1, 0, -2.5);
    scene.add(rimCyan, rimPink, new THREE.AmbientLight('#ffffff', 3.4));

    // ---------- background text: split into letters ----------
    // Each letter is a little rigid body. The eggplant hands over its own
    // velocity where it touches (plus a kick on first contact) and the
    // off-centre contact makes it spin. Once untouched for a moment, a
    // spring with slight overshoot pulls it home.
    const KICK = 320;            // extra push on first contact (px/s)
    const TRANSFER = 1.7;        // share of the eggplant's approach speed given to the letter
    const FRICTION = 0.35;       // share of its sliding speed dragged along
    const SPIN = 1.6;            // torque gain
    const MAX_V = 3200;          // px/s
    const MAX_W = 1400;          // deg/s
    const POP_SCALE = 1.18;      // grows a bit while knocked about
    const RETURN_DUR = 1.8;      // felt return time (s)
    const FLY_DRAG = 1.6;        // damping while knocked; sets how far letters travel

    const backdrop = document.getElementById('backdrop');
    const letters = [];
    backdrop.querySelectorAll('[data-scatter]').forEach((host) => {
      const nodes = [];
      const walk = document.createTreeWalker(host, NodeFilter.SHOW_TEXT);
      while (walk.nextNode()) nodes.push(walk.currentNode);
      for (const node of nodes) {
        const frag = document.createDocumentFragment();
        for (const ch of node.nodeValue) {
          const span = document.createElement('span');
          span.className = 'sc-l';
          span.textContent = ch;
          frag.appendChild(span);
          if (ch.trim()) letters.push({ el: span });   // spaces stay put
        }
        node.parentNode.replaceChild(frag, node);
      }
    });

    // return spring, ζ = 0.45 so it overshoots a touch before settling
    const W0 = 4 / (0.45 * RETURN_DUR);
    const LK = W0 * W0, LC = 2 * 0.45 * W0;

    for (const L of letters) {
      L.x = L.y = L.r = L.vx = L.vy = L.vr = 0;
      L.s = 1; L.hit = -1e9; L.touching = false; L.dirty = false;
    }

    // offsetLeft/Top ignore transforms, so this gives rest positions even mid-flight
    function measureLetters() {
      for (const L of letters) {
        let x = 0, y = 0, n = L.el;
        while (n && n !== backdrop) { x += n.offsetLeft; y += n.offsetTop; n = n.offsetParent; }
        L.hw = L.el.offsetWidth / 2;
        L.hh = L.el.offsetHeight / 2;
        L.cx = x + L.hw;
        L.cy = y + L.hh;
        L.inertia = 3 / (L.hw * L.hw + L.hh * L.hh);   // 1/I for a box, per unit mass
      }
    }
    measureLetters();
    if (document.fonts) document.fonts.ready.then(measureLetters);

    function stepLetters(dt, t) {
      const steps = 3, h = dt / steps;
      for (const L of letters) {
        // 0 right after a touch → 1 once it has been left alone; blends drift into return
        const home = smooth(0.25, 0.75, t - L.hit);
        const k = LK * home, c = LC * home + FLY_DRAG * (1 - home);
        for (let i = 0; i < steps; i++) {
          L.vx += (-k * L.x - c * L.vx) * h;
          L.vy += (-k * L.y - c * L.vy) * h;
          L.vr += (-k * L.r - c * L.vr) * h;
          L.x += L.vx * h; L.y += L.vy * h; L.r += L.vr * h;
        }
        L.s += (1 + (POP_SCALE - 1) * (1 - home) - L.s) * Math.min(1, 10 * dt);

        const moved = Math.abs(L.x) > 0.05 || Math.abs(L.y) > 0.05
                   || Math.abs(L.r) > 0.05 || Math.abs(L.s - 1) > 0.002;
        if (!moved && !L.dirty) continue;
        L.el.style.transform = moved
          ? `translate3d(${L.x.toFixed(2)}px, ${L.y.toFixed(2)}px, 0) rotate(${L.r.toFixed(2)}deg) scale(${L.s.toFixed(3)})`
          : '';
        L.dirty = moved;
      }
    }

    // The eggplant is long, so it is tested as a row of circles along its
    // centre line. A letter only gets pushed while that part is moving into
    // it faster than the letter already moves away, so contact never blows up
    // and a resting eggplant lets letters settle back.
    function collide(probes, t) {
      for (const L of letters) {
        const px = L.cx + L.x, py = L.cy + L.y;
        let best = null, bestGap = Infinity, qx = 0, qy = 0;
        for (const p of probes) {
          const nx = clamp(p.x, px - L.hw, px + L.hw);
          const ny = clamp(p.y, py - L.hh, py + L.hh);
          const gap = Math.hypot(p.x - nx, p.y - ny) - p.r;
          if (gap < bestGap) { bestGap = gap; best = p; qx = nx; qy = ny; }
        }
        if (bestGap > 0) { L.touching = false; continue; }

        let nx = px - best.x, ny = py - best.y;
        let nl = Math.hypot(nx, ny);
        if (nl < 1e-3) { nx = best.vx; ny = best.vy; nl = Math.hypot(nx, ny) || 1; }
        nx /= nl; ny /= nl;

        const rvx = best.vx - L.vx, rvy = best.vy - L.vy;
        const vn = rvx * nx + rvy * ny;
        let dvx = 0, dvy = 0;
        if (!L.touching) { dvx += nx * KICK; dvy += ny * KICK; }
        if (vn > 0) {
          dvx += nx * vn * TRANSFER + (rvx - nx * vn) * FRICTION;
          dvy += ny * vn * TRANSFER + (rvy - ny * vn) * FRICTION;
        }
        L.touching = true;
        if (!dvx && !dvy) continue;

        L.vx += dvx; L.vy += dvy;
        const sp = Math.hypot(L.vx, L.vy);
        if (sp > MAX_V) { L.vx *= MAX_V / sp; L.vy *= MAX_V / sp; }
        // spin from the off-centre contact point (screen y points down, so + is clockwise)
        const rx = qx - px, ry = qy - py;
        L.vr = clamp(L.vr + (rx * dvy - ry * dvx) * L.inertia * (180 / Math.PI) * SPIN, -MAX_W, MAX_W);
        L.hit = t;
      }
    }

    // ---------- eggplant rig ----------
    // Centre line of the model, measured from its vertices (model units, the
    // emoji's own diagonal pose), as a smooth curve from the calyx to the tip.
    // A smooth line matters: on a polyline the nearest point jumps on the inner
    // side of each corner, which shows up as a hard seam once the body bends.
    const centerCurve = new THREE.CatmullRomCurve3([
      [-1.2, 2.0], [-0.97, 1.35], [-0.73, 1.0], [-0.5, 0.6], [-0.28, 0.25],
      [-0.01, -0.01], [0.27, -0.31], [0.69, -0.5], [1.13, -0.68], [1.5, -1.15],
    ].map(([x, y]) => new THREE.Vector3(x, y, 0)), false, 'centripetal');
    const TOTAL = centerCurve.getLength();
    const pointAt = (arc) => centerCurve.getPointAt(clamp(arc / TOTAL, 0, 1));

    // dense samples of the curve for nearest-point lookups
    const SAMPLES = centerCurve.getSpacedPoints(240);
    const SAMPLE_STEP = TOTAL / 240;

    // arc length of the closest point on the centre line
    function arcLength(x, y) {
      let best = Infinity, arc = 0;
      for (let i = 0; i < SAMPLES.length - 1; i++) {
        const a = SAMPLES[i], b = SAMPLES[i + 1];
        const abx = b.x - a.x, aby = b.y - a.y;
        const u = clamp(((x - a.x) * abx + (y - a.y) * aby) / (abx * abx + aby * aby), 0, 1);
        const d = Math.hypot(a.x + abx * u - x, a.y + aby * u - y);
        if (d < best) { best = d; arc = (i + u) * SAMPLE_STEP; }
      }
      return arc;
    }

    // Same layout as the 🍆.ws rig: a static root at the top of the calyx and
    // four spring bones down the body (heads at these distances along the line).
    const BONE_ARCS = [0, 0.58, 1.38, 2.25, 3.25];
    // body radius along the centre line, used for hits (model units)
    const PROBES = [[0, 0.7], [0.6, 0.75], [1.2, 0.75], [1.8, 0.85], [2.4, 0.95], [3.0, 0.95], [3.6, 0.8], [TOTAL - 0.1, 0.45]];

    // Rotate so the first segment points straight down: that is the hanging
    // pose. Rotating back by the same angle gives the emoji pose.
    const ORIGIN = pointAt(0);
    const first = pointAt(BONE_ARCS[1]).sub(ORIGIN);
    const EMOJI_TILT = Math.atan2(first.y, first.x) + Math.PI / 2;
    const toHang = (v) => new THREE.Vector3(v.x - ORIGIN.x, v.y - ORIGIN.y, 0)
      .applyAxisAngle(new THREE.Vector3(0, 0, 1), -EMOJI_TILT);

    const heads = BONE_ARCS.map((a) => toHang(pointAt(a)));
    const tipHang = toHang(pointAt(TOTAL));

    // wiggle expects each bone's +Y to run along the bone and its child to sit
    // at (0, length, 0), the way Blender exports bones
    const UP = new THREE.Vector3(0, 1, 0);
    const boneDirs = heads.map((h, i) => (i + 1 < heads.length ? heads[i + 1] : tipHang).clone().sub(h).normalize());
    const boneQuats = boneDirs.map((d) => new THREE.Quaternion().setFromUnitVectors(UP, d));

    const rig = new THREE.Group();                // follows the cursor
    scene.add(rig);
    const bones = heads.map(() => new THREE.Bone());
    bones.forEach((bone, i) => {
      if (i === 0) {
        bone.position.copy(heads[0]);
        bone.quaternion.copy(boneQuats[0]);
        rig.add(bone);
      } else {
        bone.position.set(0, heads[i].distanceTo(heads[i - 1]), 0);
        bone.quaternion.copy(boneQuats[i - 1]).invert().multiply(boneQuats[i]);
        bones[i - 1].add(bone);
      }
    });
    rig.updateMatrixWorld(true);

    // ---------- skin weights ----------
    // Broad, overlapping weights, the way a hand-painted rig does it. Every
    // hand-over is long: the first (bouncy) spring bone owns the stem, calyx
    // and upper body and fades out slowly down to mid-body; the last (syrupy)
    // bone takes over the lower half, with bones 2 and 3 shared in between.
    // Points are carried by two to four bones at once, so a swing spreads down
    // the body like jelly instead of turning at a hinge, which would crease
    // and show as layers. Inside the calyx the weights barely change, so the
    // shell and the body under it move as one.
    function skinWeights(arc) {
      const b1 = 1 - smooth(1.0, 2.2, arc);
      const b4 = 0.85 * smooth(1.7, 3.3, arc);
      const rest = Math.max(0, 1 - b1 - b4);
      const toward2 = 1 - smooth(1.5, 2.8, arc);   // upper part of the rest goes to bone 2, lower to 3
      return [[1, b1], [2, rest * toward2], [3, rest * (1 - toward2)], [4, b4]].filter(([, v]) => v > 1e-4);
    }

    // Body and calyx come as separate meshes in the file; they are merged into
    // one skinned mesh so the whole eggplant deforms as a single surface.
    function rigModel(sources) {
      const s = 1 / sources[0].matrixWorld.getMaxScaleOnAxis();
      const pieces = sources.map((source) => {
        const baked = source.geometry.clone();
        // bake the file's node transforms, then undo its overall 0.01 scale
        baked.applyMatrix4(source.matrixWorld);
        baked.scale(s, s, s);
        // The model is low-poly (long faces run across the joints), so it is
        // split into small triangles first; otherwise each face bends as a flat
        // plate and the plate edges show while it moves.
        return new TessellateModifier(0.12, 8).modify(baked);
      });

      // bind pose has to be taken with the rig at identity, the way the mesh is laid out
      const savedScale = rig.scale.clone();
      rig.scale.setScalar(1);
      rig.updateMatrixWorld(true);
      const skeleton = new THREE.Skeleton(bones);
      rig.scale.copy(savedScale);
      rig.updateMatrixWorld(true);

      const geo = mergeGeometries(pieces);
      const pos = geo.attributes.position;
      const idx = new Uint16Array(pos.count * 4);
      const wgt = new Float32Array(pos.count * 4);
      for (let i = 0; i < pos.count; i++) {
        // keep the four strongest influences
        const top = skinWeights(arcLength(pos.getX(i), pos.getY(i))).sort((a, b) => b[1] - a[1]).slice(0, 4);
        const sum = top.reduce((a, [, v]) => a + v, 0) || 1;
        top.forEach(([b, v], k) => { idx[i * 4 + k] = b; wgt[i * 4 + k] = v / sum; });
      }
      geo.setAttribute('skinIndex', new THREE.Uint16BufferAttribute(idx, 4));
      geo.setAttribute('skinWeight', new THREE.Float32BufferAttribute(wgt, 4));

      geo.translate(-ORIGIN.x, -ORIGIN.y, 0);
      geo.rotateZ(-EMOJI_TILT);

      // keep the model's colour texture, give it the glossy metallic finish of 🍆.ws
      const material = new THREE.MeshPhysicalMaterial({
        map: sources[0].material.map,
        metalness: 0.92,
        roughness: 0.5,
        // front faces only, like 🍆.ws: drawing back faces lets the inside of
        // the calyx shell and of the body show through as extra layers when it folds
        side: THREE.FrontSide,
      });
      const mesh = new THREE.SkinnedMesh(geo, material);
      mesh.bind(skeleton);
      mesh.frustumCulled = false;
      scene.add(mesh);
      return mesh;
    }

    rig.scale.setScalar(0.8);

    // spring settings per wiggle bone, as on 🍆.ws: the two upper ones bounce,
    // the two lower ones are stiff but heavily damped so they trail like syrup
    const SPRINGS = [
      { stiffness: 700, damping: 25 },
      { stiffness: 700, damping: 25 },
      { stiffness: 6000, damping: 1600 },
      { stiffness: 6000, damping: 1600 },
    ];

    // ---------- pointer → point on a plane facing the camera ----------
    const ray = new THREE.Raycaster();
    const ndc = new THREE.Vector2();
    const camDir = camera.getWorldDirection(new THREE.Vector3());
    const camRight = new THREE.Vector3().setFromMatrixColumn(camera.matrixWorld, 0);
    const aimPlane = new THREE.Plane().setFromNormalAndCoplanarPoint(
      camDir.clone().negate(),
      camera.position.clone().addScaledVector(camDir, 10)
    );

    function planePoint(x, y, out) {
      ndc.set((x / innerWidth) * 2 - 1, -(y / innerHeight) * 2 + 1);
      ray.setFromCamera(ndc, camera);
      return ray.ray.intersectPlane(aimPlane, out);
    }

    const _proj = new THREE.Vector3();
    function toScreen(v, out) {
      _proj.copy(v).project(camera);
      out.x = (_proj.x + 1) / 2 * innerWidth;
      out.y = (1 - _proj.y) / 2 * innerHeight;
      return out;
    }

    const target = new THREE.Vector3();
    let held = false;          // becomes true on the first pointer event

    function onPointer(e) {
      e.preventDefault();
      planePoint(e.clientX, e.clientY, target);
      held = true;
    }
    renderer.domElement.addEventListener('pointermove', onPointer, { passive: false });
    renderer.domElement.addEventListener('pointerdown', onPointer, { passive: false });
    addEventListener('wheel', (e) => e.preventDefault(), { passive: false });
    addEventListener('touchmove', (e) => e.preventDefault(), { passive: false });

    // ---------- resize ----------
    function resize() {
      renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
      renderer.setSize(innerWidth, innerHeight);
      camera.aspect = innerWidth / innerHeight;
      camera.updateProjectionMatrix();
      measureLetters();
    }
    addEventListener('resize', resize);
    resize();

    // ---------- pose ----------
    // Until someone touches it the eggplant lies diagonally like the emoji.
    // Once held, it hangs from the cursor facing the camera, its bottom
    // leaning 20° away from the viewer.
    const HANG_LEAN = 20 * Math.PI / 180;

    function orientRig() {
      rig.lookAt(camera.position);
      if (held) rig.rotateX(HANG_LEAN);
      else rig.rotateZ(EMOJI_TILT);
    }

    // ---------- load model, then run ----------
    const gltf = await new GLTFLoader().loadAsync(MODEL_URL);
    gltf.scene.updateMatrixWorld(true);
    const parts = [];
    // the file also carries a display box and frame; only the eggplant is used
    gltf.scene.traverse((o) => { if (o.isMesh && !/^(Box|Frame)/.test(o.name)) parts.push(o); });
    const eggplant = rigModel(parts);
    eggplant.geometry.computeBoundingBox();
    const bounds = eggplant.geometry.boundingBox;

    // start with the whole emoji centred on screen
    orientRig();
    rig.updateMatrixWorld(true);
    planePoint(innerWidth / 2, innerHeight / 2, target);
    rig.position.add(target).sub(rig.localToWorld(bounds.getCenter(new THREE.Vector3())));
    target.copy(rig.position);
    rig.updateMatrixWorld(true);
    // the root stays static (moved by the rig); the rest become springs
    const wiggles = bones.slice(1).map((bone, i) => new WiggleBone(bone, SPRINGS[i]));

    // ---------- loop ----------
    // collision probes along the centre line, in screen px
    const probes = PROBES.map(() => ({ x: 0, y: 0, vx: 0, vy: 0, r: 0, seen: false }));
    const _pt = new THREE.Vector3(), _edge = new THREE.Vector3(), _scr = { x: 0, y: 0 };
    // the centre line as the bones draw it: every bone head, then the tip
    const TIP_LEN = heads[heads.length - 1].distanceTo(tipHang);
    const joints = [...bones.map(() => new THREE.Vector3()), new THREE.Vector3()];
    const jointArcs = [...BONE_ARCS, TOTAL];

    function updateProbes(dt) {
      bones.forEach((b, i) => joints[i].setFromMatrixPosition(b.matrixWorld));
      bones[bones.length - 1].localToWorld(joints[bones.length].set(0, TIP_LEN, 0));
      // px per model unit at the eggplant's depth
      toScreen(joints[0], _scr);
      const x0 = _scr.x, y0 = _scr.y;
      toScreen(_edge.copy(joints[0]).add(camRight), _scr);
      const pxPerUnit = Math.hypot(_scr.x - x0, _scr.y - y0) * rig.scale.x;

      PROBES.forEach(([arc, radius], i) => {
        let j = 0;
        while (j < jointArcs.length - 2 && arc > jointArcs[j + 1]) j++;
        _pt.lerpVectors(joints[j], joints[j + 1], clamp((arc - jointArcs[j]) / (jointArcs[j + 1] - jointArcs[j]), 0, 1));
        toScreen(_pt, _scr);
        const p = probes[i];
        if (p.seen && dt > 0) {
          // lightly smoothed so one long frame doesn't fire a huge kick
          p.vx += ((_scr.x - p.x) / dt - p.vx) * 0.6;
          p.vy += ((_scr.y - p.y) / dt - p.vy) * 0.6;
        }
        p.x = _scr.x; p.y = _scr.y; p.seen = true;
        p.r = radius * pxPerUnit;
      });
    }

    // Physics runs on its own fixed 500 Hz clock, independent of the screen's
    // refresh rate; each frame catches up with as many 2 ms steps as are due.
    // wiggle's springs read Date.now(), so during a step that clock is pointed
    // at the simulated time and every spring advances exactly one step.
    const SIM_HZ = 500;
    const SIM_MS = 1000 / SIM_HZ;
    const MAX_STEPS = 50;                         // after a stall, skip ahead instead of spiralling
    const FOLLOW = 24;                            // how fast the grip chases the cursor (1/s)
    const realDateNow = Date.now;
    let simClock = realDateNow();
    let simBehind = 0;

    function simStep() {
      rig.position.lerp(target, 1 - Math.exp(-FOLLOW / SIM_HZ));
      orientRig();
      rig.updateMatrixWorld(true);
      simClock += SIM_MS;
      Date.now = () => simClock;
      try { wiggles.forEach((w) => w.step()); }
      finally { Date.now = realDateNow; }
    }

    let prev = performance.now();
    function frame(now) {
      simBehind += now - prev;
      const dt = Math.min((now - prev) / 1000, 1 / 20);
      prev = now;

      let steps = 0;
      while (simBehind >= SIM_MS && steps < MAX_STEPS) { simStep(); simBehind -= SIM_MS; steps++; }
      if (steps === MAX_STEPS) simBehind = 0;

      // the eggplant only knocks letters once someone is moving it
      updateProbes(dt);
      if (held) collide(probes, now / 1000);
      stepLetters(dt, now / 1000);

      renderer.render(scene, camera);
      requestAnimationFrame(frame);
    }
    requestAnimationFrame(frame);
  </script>
</body>
</html>
